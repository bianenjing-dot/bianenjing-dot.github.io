name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Reassemble and verify frozen website
        run: |
          cat portfolio.zip.part* > portfolio.zip
          sha256sum -c bundle.sha256
          mkdir _site
          unzip -q portfolio.zip -d _site
          test -f _site/index.html
          python3 -c "from pathlib import Path; p=Path('_site/desktop/index.html'); p.write_text(p.read_text().replace('https://my.cbox.ws/maikeliya', 'https://www3.cbox.ws/box/?boxid=3562298&amp;boxtag=5D3Pns'))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
