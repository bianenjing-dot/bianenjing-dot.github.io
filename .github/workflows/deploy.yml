name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reassemble and verify frozen website
        run: |
          cat portfolio.zip.part* > portfolio.zip
          sha256sum -c bundle.sha256
          mkdir _site
          unzip -q portfolio.zip -d _site
          unzip -oq portfolio-update.zip -d _site
          test -f _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allow artifact metadata to become available
        run: sleep 15
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
